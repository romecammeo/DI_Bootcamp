<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="elem" about="Elephant" hello="world" >Hello World!</div>
    <script>
        const newDiv = document.querySelector("#elem");
        newDiv.setAttribute("style","color:blue");
        alert(newDiv.getAttribute("About")); 
        for (let attr of newDiv.attributes) {
         console.log("Key:" + attr.name + "Value:" + attr.value)
        }
    </script>
</body>
</html>
